<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Majora Games - Arcade Dashboard</title>
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;800&display=swap" rel="stylesheet">
    
    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <!-- Contenedor Principal (Layout Vertical) -->
    <div class="app-container">
        
        <!-- ZONA SUPERIOR: Menú y Reloj -->
        <div class="top-section">
            
            <!-- PANEL IZQUIERDO: Los Botones Gigantes -->
            <div class="main-menu" id="mainMenu">
                <h2 class="menu-title">Selecciona tu Estación</h2>
                
                <div class="giant-buttons-grid">
                    <!-- Botón PC -->
                    <button class="giant-btn" data-target="pc">
                        <i class="fas fa-desktop"></i>
                        <span>PC Gamer</span>
                        <small>15 Bs / Hora</small>
                    </button>

                    <!-- Botón PS5 -->
                    <button class="giant-btn" data-target="ps5">
                        <i class="fab fa-playstation"></i>
                        <span>PlayStation 5</span>
                        <small>12 Bs / Hora</small>
                    </button>

                    <!-- Botón Xbox -->
                    <button class="giant-btn" data-target="xbox">
                        <i class="fab fa-xbox"></i>
                        <span>Xbox 360</span>
                        <small>8 Bs / Hora</small>
                    </button>

                    <!-- Botón Bebidas -->
                    <button class="giant-btn btn-drink" data-target="bebidas">
                        <i class="fas fa-glass-martini-alt"></i>
                        <span>Bebidas</span>
                        <small>Snacks y Refrescos</small>
                    </button>
                </div>
            </div>

            <!-- ZONA DE CATÁLOGO (Oculta al inicio) -->
            <div class="catalog-section" id="catalogSection">
                <div class="d-flex justify-content-between align-items-center mb-3">
                    <button class="btn btn-outline-success btn-sm" id="btnBack"><i class="fas fa-arrow-left"></i> Volver</button>
                    <h4 id="catalogTitle" class="m-0 text-success fw-bold">Juegos</h4>
                </div>

                <!-- Buscador -->
                <input type="text" id="gameSearch" class="form-control mb-3 bg-dark text-white border-success" placeholder="Buscar juego en esta estación...">

                <!-- Contenedor de Juegos (Se llena con JS) -->
                <div class="game-grid" id="gameGrid">
                    <!-- Aquí se inyectan los juegos dinámicamente -->
                </div>
            </div>

            <!-- PANEL LATERAL DERECHO (Logo, Reloj, Bitácora) -->
            <div class="side-panel">
                <div class="brand-box">
                    <h1>MAJORA<br>GAMES</h1>
                </div>

                <div class="clock-box">
                    <h3 id="liveClock">00:00:00</h3>
                    <small>HORA LOCAL</small>
                </div>

                <div class="bitacora-box">
                    <h6><i class="fas fa-list-alt"></i> Bitácora (Admin)</h6>
                    <div class="log-console" id="logOutput">
                        <div class="text-muted">[SISTEMA] Esperando transacciones...</div>
                    </div>
                </div>
            </div>
        </div>

        <!-- FOOTER (Línea blanca de tu dibujo) -->
        <footer class="app-footer">
            <div class="social-links">
                <a href="#"><i class="fab fa-tiktok"></i></a>
                <a href="#"><i class="fab fa-instagram"></i></a>
                <a href="#"><i class="fab fa-whatsapp"></i></a>
                <a href="#"><i class="fab fa-facebook"></i></a>
            </div>
            <p class="m-0 text-muted" style="font-size: 11px;">2026 Majora Games - Diseño Web II</p>
        </footer>
    </div>

    <!-- MODAL DE RESERVA -->
    <div class="modal fade" id="reservaModal" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content bg-dark border-success text-white">
                <div class="modal-header border-bottom border-secondary">
                    <h5 class="modal-title text-success">Confirmar Reserva</h5>
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body text-center">
                    <h4 id="modalConsoleName" class="text-warning mb-3">Consola</h4>
                    
                    <div class="mb-3">
                        <label class="form-label">Horas a Jugar</label>
                        <input type="number" id="hrsInput" class="form-control bg-dark text-white border-secondary text-center" Value="1" min="1">
                    </div>

                    <div class="total-box mb-3">
                        <h6 class="m-0">Total a Pagar:</h6>
                        <h3 class="m-0 text-success"><span id="totalPay">15</span> BOB</h3>
                    </div>

                    <div class="alert alert-danger m-0 py-2">
                        <small>Tiempo para confirmar: <strong id="timerDisplay">05:00</strong></small>
                    </div>
                </div>
                <div class="modal-footer border-top border-secondary">
                    <button type="button" class="btn btn-outline-secondary btn-sm" data-bs-dismiss="modal" id="btnCancel">Cancelar</button>
                    <button type="button" class="btn btn-success btn-sm" id="btnConfirm">Pagar y Reservar</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Toast Alert (Reto PRO) -->
    <div id="toastAlert" class="custom-toast">
        <i class="fas fa-check-circle text-success me-2"></i> ¡Reserva procesada con éxito!
    </div>

    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="script.js"></script>
</body>
</html>
